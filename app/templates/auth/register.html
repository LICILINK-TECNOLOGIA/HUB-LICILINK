{% extends 'base.html' %}

{% block title %}Registro - LiciLink HUB{% endblock %}

{% block extra_head %}
<style>
    .auth-container {
        width: 100%;
        max-width: 450px;
        background-color: var(--white);
        padding: 2.5rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        margin-top: 2rem;
    }
    .auth-title {
        color: var(--primary-blue);
        margin-bottom: 1.5rem;
        text-align: center;
    }
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--text-muted);
    }
    .auth-footer a {
        color: var(--accent-orange);
        text-decoration: none;
        font-weight: 600;
    }
    .section-title {
        font-size: 1rem;
        color: var(--text-muted);
        margin: 1.5rem 0 1rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.5rem;
    }
    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    .password-wrapper .form-control {
        padding-right: 2.5rem;
    }
    .toggle-password {
        position: absolute;
        right: 0.5rem;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
    }
    .toggle-password:hover {
        color: var(--primary-blue);
    }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleButtons = document.querySelectorAll('.toggle-password');
        
        toggleButtons.forEach(button => {
            button.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                const eyeIcon = this.querySelector('.eye-icon');
                const eyeOffIcon = this.querySelector('.eye-off-icon');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.style.display = 'none';
                    eyeOffIcon.style.display = 'block';
                    this.setAttribute('aria-label', 'Ocultar senha');
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                    this.setAttribute('aria-label', 'Mostrar senha');
                }
            });
        });
    });
</script>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Crie sua Conta LiciLink</h2>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label" for="name">Nome Completo</label>
            <input type="text" id="name" name="name" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">E-mail Corporativo</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Senha</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" class="form-control" required>
                <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="password_confirm">Confirmar Senha</label>
            <div class="password-wrapper">
                <input type="password" id="password_confirm" name="password_confirm" class="form-control" required>
                <button type="button" class="toggle-password" data-target="password_confirm" aria-label="Mostrar senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-1">Registrar e Continuar</button>
    </form>
    <div class="auth-footer">
        Já possui uma conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
    </div>
</div>
{% endblock %}
