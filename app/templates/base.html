<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HUB de Sistemas LiciLink{% endblock %}</title>
    <meta name="description" content="HUB de Sistemas LiciLink - Acesse de forma centralizada as soluções para gestão, planejamento e documentação.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        licilink: {
                            blue: '#1565C0',
                            orange: '#F4511E',
                            white: '#FFFFFF',
                            bg: '#FAFAFA',
                            dark: '#303030',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#303030] flex flex-col min-h-screen">

    <!-- Header Institucional -->
    <header class="w-full z-50 bg-[#0A2E68] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center py-4">
            <!-- Logo / Identificação -->
            <div class="flex items-center space-x-3">
                <span class="font-bold text-xl tracking-tight text-white">
                    LiciLink <span class="text-[#FF7043] font-semibold text-sm block sm:inline">TECNOLOGIA</span>
                </span>
            </div>

            <!-- Navegação -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
                <a href="#" class="hover:text-[#FF7043] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#FF7043] rounded px-2 py-1">Página Principal (Site)</a>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-sm mt-auto border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center text-xs text-slate-500">
                &copy; 2026 LICILINK TECNOLOGIA. Todos os direitos reservados.
            </div>
        </div>
    </footer>
</body>
</html>
