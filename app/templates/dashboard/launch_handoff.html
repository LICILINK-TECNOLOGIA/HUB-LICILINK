<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            text-align: center;
            color: #303030;
            background-color: #FAFAFA;
        }
        button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p>Redirecionando para o sistema selecionado...</p>
    <form method="post" action="{{ destination_url }}" id="handoff-form">
        <input type="hidden" name="code" value="{{ code }}">
        <button type="submit">Continuar</button>
    </form>
    <script src="{{ url_for('static', filename='js/launch_handoff.js') }}" defer></script>
</body>
</html>
